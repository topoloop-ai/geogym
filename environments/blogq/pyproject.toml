[project]
name = "geogym-blogq"
version = "0.1.0"
description = "Answer a traveller's question with OpenStreetMap places search and a travel-blog corpus, cited so a verifier can check it. Ships Ask Maps Basic (100 questions). Needs TOPOLOOP_KEY and a judge endpoint."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["verifiers", "httpx", "openai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geogym_blogq"]
